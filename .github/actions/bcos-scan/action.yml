name: "BCOS v2 Scan"
description: "Reusable GitHub Action to scan, score, comment, and attest repos with the BCOS v2 engine"
author: "RustChain BCOS"

inputs:
  tier:
    description: "Review tier (L0, L1, L2)"
    required: true
    default: "L1"
  reviewer:
    description: "GitHub login or Beacon identity of the reviewer"
    required: false
    default: ""
  node-url:
    description: "RustChain node URL used for badge links and merge anchoring"
    required: false
    default: "https://rustchain.org"
  path:
    description: "Repository path to scan"
    required: false
    default: "."
  pr-number:
    description: "PR number to comment on (defaults to current PR)"
    required: false
    default: ""
  github-token:
    description: "GitHub token used to create or update the PR comment"
    required: false
    default: ""
  repo-token:
    description: "Deprecated alias for github-token"
    required: false
    default: ""

outputs:
  trust_score:
    description: "BCOS trust score (0-100)"
    value: ${{ steps.scan.outputs.trust_score }}
  cert_id:
    description: "BCOS attestation certificate ID"
    value: ${{ steps.scan.outputs.cert_id }}
  tier_met:
    description: "Whether the required tier was met (true/false)"
    value: ${{ steps.scan.outputs.tier_met }}

runs:
  using: "composite"
  steps:
    - id: scan
      shell: bash
      env:
        INPUT_TIER: ${{ inputs.tier }}
        INPUT_REVIEWER: ${{ inputs.reviewer }}
        INPUT_NODE_URL: ${{ inputs['node-url'] }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PR_NUMBER: ${{ inputs['pr-number'] }}
        INPUT_GITHUB_TOKEN: ${{ inputs['github-token'] || github.token }}
        INPUT_REPO_TOKEN: ${{ inputs['repo-token'] }}
      run: ${{ github.action_path }}/entrypoint.sh
      working-directory: ${{ github.workspace }}
