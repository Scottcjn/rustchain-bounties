name: 'RTC Reward Action'
description: 'Automatically awards RTC tokens when a PR is merged. Any open source project can add this to reward contributors with crypto.'
author: 'SolFoundry'
branding:
  icon: 'award'
  color: 'gold'

inputs:
  node-url:
    description: 'RustChain node URL'
    required: false
    default: 'https://50.28.86.131'
  amount:
    description: 'Amount of RTC to award per merged PR'
    required: false
    default: '5'
  wallet-from:
    description: 'Source wallet name for payments'
    required: true
  admin-key:
    description: 'Admin key for the source wallet (use GitHub Secret)'
    required: true
  dry-run:
    description: 'Dry-run mode (does not actually send RTC)'
    required: false
    default: 'false'
  min-pr-body-length:
    description: 'Minimum length of PR body to accept (to prevent empty PRs)'
    required: false
    default: '10'

runs:
  using: 'composite'
  steps:
    - name: 'Validate PR event'
      id: validate
      env:
        # SECURITY: pass the PR body via env, never inline it into the shell.
        # A malicious PR body could otherwise smuggle $(...) / backticks / quotes
        # and execute arbitrary commands in the runner.
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_BODY_LEN_MIN: ${{ inputs.min-pr-body-length }}
      run: |
        if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
          echo "PR was not merged, skipping."
          exit 0
        fi
        BODY_LEN=$(printf '%s' "$PR_BODY" | wc -c)
        if [[ "$BODY_LEN" -lt "$PR_BODY_LEN_MIN" ]]; then
          echo "PR body too short (< $PR_BODY_LEN_MIN chars). Skipping."
          echo "contributor_wallet=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "PR is merged and body is valid."

    - name: 'Extract contributor wallet from PR body'
      id: extract-wallet
      env:
        # SECURITY: pass the PR body via env, never inline it into the shell.
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        set -euo pipefail
        # 1. Prefer canonical native RustChain address (RTC + 40 hex chars).
        WALLET=$(printf '%s' "$PR_BODY" | grep -oE 'RTC[a-fA-F0-9]{40}' | head -1 || true)
        # 2. Explicit Wallet / wallet_name / miner_id label line (never bare inline code spans).
        if [[ -z "$WALLET" ]]; then
          WALLET=$(printf '%s' "$PR_BODY" | grep -oiE '(rtc[ _-]?)?(wallet([ _-]?name|[ _-]?id|[ _-]?address)?|miner[ _-]?id)[:= ]+`?[a-zA-Z0-9_-]{3,43}`?' | head -1 | sed -E 's/.*[:= ]+`?//; s/`$//' || true)
        fi
        # 3. EVM fallback (0x + 40 hex chars) if explicitly provided.
        if [[ -z "$WALLET" ]]; then
          WALLET=$(printf '%s' "$PR_BODY" | grep -oE '0x[a-fA-F0-9]{40}' | head -1 || true)
        fi
        # Strict whitelist before exporting: RTC[0-9a-fA-F]{40}, [A-Za-z0-9_-]{3,39}, or 0x[0-9a-fA-F]{40}.
        if [[ "$WALLET" =~ ^RTC[a-fA-F0-9]{40}$ ]] || [[ "$WALLET" =~ ^[a-zA-Z0-9_-]{3,39}$ ]] || [[ "$WALLET" =~ ^0x[a-fA-F0-9]{40}$ ]]; then
          echo "Contributor wallet: $WALLET"
        else
          echo "::warning::Could not extract a valid wallet from PR body."
          WALLET=""
        fi
        echo "contributor_wallet=$WALLET" >> "$GITHUB_OUTPUT"

    - name: 'Show PR info'
      run: |
        echo "PR #${{ github.event.pull_request.number }} merged by ${{ github.event.pull_request.user.login }}"
        echo "Contributor wallet: ${{ steps.extract-wallet.outputs.contributor_wallet }}"
        echo "Amount: ${{ inputs.amount }} RTC"

    - name: 'Dry-run confirmation'
      if: ${{ inputs.dry-run == 'true' }}
      run: |
        echo "=== DRY RUN MODE ==="
        echo "Would award ${{ inputs.amount }} RTC from wallet '${{ inputs.wallet-from }}' to '${{ steps.extract-wallet.outputs.contributor_wallet }}'"
        echo "Would post comment on PR #${{ github.event.pull_request.number }}"

    - name: 'Award RTC'
      if: ${{ inputs.dry-run != 'true' && steps.extract-wallet.outputs.contributor_wallet != '' }}
      env:
        # SECURITY: pass secrets via env, not via ${{ }} inline expansion.
        # ${{ }} expands secrets directly into the shell command string,
        # which means they appear in `ps` output and any command-line dump.
        NODE_URL: ${{ inputs.node-url }}
        FROM_WALLET: ${{ inputs.wallet-from }}
        ADMIN_KEY: ${{ inputs.admin-key }}
        TO_WALLET: ${{ steps.extract-wallet.outputs.contributor_wallet }}
        AMOUNT: ${{ inputs.amount }}
      run: |
        # SECURITY: build JSON via python json.dumps to avoid shell-quoting /
        # interpolation issues; secrets are read from env (never appear on the
        # command line) and serialized by python.
        PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"from_wallet": os.environ["FROM_WALLET"], "admin_key": os.environ["ADMIN_KEY"], "to_wallet": os.environ["TO_WALLET"], "amount": float(os.environ["AMOUNT"])}))')
        curl -sSk -X POST "$NODE_URL/wallet/send" \
          -H "Content-Type: application/json" \
          --data-raw "$PAYLOAD" -o /tmp/rtc-response.json
        if python3 -c 'import json,sys; d=json.load(open("/tmp/rtc-response.json")); sys.exit(0 if isinstance(d,dict) and d.get("ok") is True else 1)' 2>/dev/null; then
          echo "RTC sent successfully!"
        else
          echo "::error::Failed to send RTC. Check response below."
          cat /tmp/rtc-response.json
          exit 1
        fi

    - name: 'Post confirmation comment'
      if: ${{ inputs.dry-run != 'true' && steps.extract-wallet.outputs.contributor_wallet != '' }}
      env:
        # SECURITY: pass secrets / user input via env, never inline ${{ }} into shell strings.
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_FULL: ${{ github.repository }}
        AMOUNT: ${{ inputs.amount }}
        TO_WALLET: ${{ steps.extract-wallet.outputs.contributor_wallet }}
      run: |
        set -euo pipefail
        # SECURITY: build JSON via python json.dumps so the wallet name
        # cannot break out of the body string, and fail loudly if the comment POST fails.
        BODY=$(python3 -c 'import json,os; body = "✅ **RTC Reward Sent!**\\n\\n awarded {amt} RTC to wallet \`{wlt}\` for merged PR #{pr}.\\n\\n_ Powered by [rtc-reward-action](https://github.com/Scottcjn/rtc-reward-action)_".format(amt=os.environ["AMOUNT"], wlt=os.environ["TO_WALLET"], pr=os.environ["PR_NUMBER"]); print(json.dumps({"body": body}))')
        curl -fsS -X POST "https://api.github.com/repos/$REPO_FULL/issues/$PR_NUMBER/comments" \
          -H "Authorization: token $GH_TOKEN" \
          -H "Content-Type: application/json" \
          --data-raw "$BODY" >/dev/null
