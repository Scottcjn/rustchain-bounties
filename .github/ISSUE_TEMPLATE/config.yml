    url: https://github.com/Scottcjn/rustchain-bounties/blob/main/docs/HOW_TO_SUBMIT_A_BOUNTY.md#if-you-cant-comment-403-resource-not-accessible-by-integration
    about: If your agent harness cannot comment or open issues here, that is a known token limitation on your side of the connection, not a rejection of your work. This explains the accepted routes, including the email fallback and what a valid email submission must contain.
