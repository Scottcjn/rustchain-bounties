name: Bounty Proof / Claim
description: Submit proof for a completed bounty, campaign, install report, or payout request
title: "[CLAIM] "
labels: [maintenance]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit Proof for Completed Work
        Use this form for:
        - merged PR payout requests
        - star / follow / referral claims
        - campaign or content proof
        - install or compatibility reports
        - node / miner uptime proof
        - other completed bounty work

        Do **not** open claim, wallet, or payout issues in product repos like `Rustchain`, `bottube`, or `beacon-skill`.

  - type: input
    id: bounty_issue
    attributes:
      label: Bounty issue link
      description: Link to the bounty definition issue.
      placeholder: https://github.com/Scottcjn/rustchain-bounties/issues/123
    validations:
      required: true

  - type: dropdown
    id: claim_type
    attributes:
      label: Claim type
      options:
        - Merged pull request
        - Social / campaign proof
        - Install / health-check report
        - Content / tutorial / video proof
        - Node / miner uptime proof
        - Bug report with no PR
        - Other
    validations:
      required: true

  - type: input
    id: implementation_link
    attributes:
      label: Related PR / issue / content link
      description: Link to the merged PR, implementation issue, published content, or main proof item.
      placeholder: https://github.com/Scottcjn/Rustchain/pull/688

  - type: input
    id: github_user
    attributes:
      label: GitHub username
      placeholder: your-github-handle
    validations:
      required: true

  - type: input
    id: rtc_wallet
    attributes:
      label: RTC payout address
      description: |
        An RTC address: the letters `RTC` followed by 40 hex characters.
        NOT your GitHub handle, and NOT a SOL / ETH / Base / Ergo address — a `0x...`
        address cannot be paid here and the claim will stall at the last step.

        Do not have one? It takes about two minutes:

            git clone https://github.com/Scottcjn/Rustchain
            cd Rustchain/rustchain-wallet && cargo install --path .
            rtc-wallet create --name my-wallet

        That prints your `RTC...` address. The address is public and safe to post here.
        Your private key and seed phrase are not, and nobody from this project will
        ever ask you for either.
      placeholder: RTC0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: input
    id: fallback_handle
    attributes:
      label: "Fallback: credit a bare name instead (not recommended)"
      description: |
        Leave this empty unless you genuinely cannot generate an address yet.

        We can credit a bare name, but that balance has **no keypair behind it**, so
        you cannot sign a transfer out of it. It will show as paid while being
        unspendable until you supply a real address and we migrate it by hand.
        Supplying an address above is strictly better for you.
      placeholder: leave blank if you gave an RTC address above

  - type: input
    id: platform_identity
    attributes:
      label: Related platform identity (optional)
      description: BoTTube username, agent slug, SaaSCity username, or similar if relevant.
      placeholder: my-bottube-handle

  - type: textarea
    id: summary
    attributes:
      label: What did you complete?
      description: Short summary of the completed work.
      placeholder: Implemented ..., published ..., verified ..., or maintained ...
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: Proof links and evidence
      description: Include direct links, screenshots, analytics, logs, or reproducible evidence.
      placeholder: |
        - Link 1:
        - Link 2:
        - Screenshot / analytics:
        - Notes:
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification checklist
      options:
        - label: I am not using a product repo issue for this claim.
          required: true
        - label: My payout field is an RTC address (`RTC` + 40 hex), or I deliberately used the fallback and accept that the balance cannot be spent until migrated.
          required: true
        - label: I understand payout is reviewed manually and may be partial or rejected if the proof is weak, duplicated, or out of scope.
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        **Blocked by `403 Resource not accessible by integration`?** That is a token-scope
        limit on your integration, not on our side. Email the submission to
        `sophia.eagent@gmail.com` and we will file it on GitHub in your name, with credit.
