# SPDX-License-Identifier: MIT
name: BCOS Checks

# Assigns / checks the review tier label on non-doc pull requests.
#
# WHY THIS IS A SEPARATE WORKFLOW
# ------------------------------
# This lived inside bcos.yml and hard-failed any PR without a tier label. But
# applying a label needs triage or write permission on the repo, which an
# outside contributor does not have. The gate was demanding something they had
# no way to do, and because the SPDX job declared `needs: [label-gate]`, that
# impossible failure also blocked the rest of CI. Five external PRs sat stuck
# on it, looking to their authors like their work had been rejected.
#
# Labelling requires a writable token, and `pull_request` hands fork PRs a
# read-only one regardless of the permissions block, so the gate has to run on
# `pull_request_target`. The SPDX job must NOT: under pull_request_target,
# `actions/checkout` fetches the BASE branch, so an SPDX scan would silently
# examine main instead of the contributor's new files and pass for the wrong
# reason. Hence two workflows with two triggers.
#
# This job is safe on pull_request_target because it only reads PR metadata and
# applies a label. It never checks out or executes the contributor's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bcos-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-gate:
    name: Review Tier Label Gate
    runs-on: ubuntu-latest
    steps:
      - name: Require or assign a review tier
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            // Accept explicit BCOS tiers or the repo's own tier labels.
            const allowedLabels = new Set([
              "BCOS-L1", "BCOS-L2", "bcos:l1", "bcos:l2",
              "micro", "standard", "major", "critical"
            ]);
            const labels = (pr.labels || []).map(l => l.name);
            const hasTier = labels.some(l => allowedLabels.has(l));

            const files = [];
            for await (const resp of github.paginate.iterator(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            )) {
              for (const f of resp.data) files.push(f.filename);
            }

            function isDocOnly(path) {
              const p = path.toLowerCase();
              if (p.startsWith("docs/")) return true;
              if (p.endsWith(".md")) return true;
              if (p.endsWith(".png") || p.endsWith(".jpg") || p.endsWith(".jpeg")
                  || p.endsWith(".gif") || p.endsWith(".svg")) return true;
              if (p.endsWith(".pdf")) return true;
              return false;
            }

            if (files.filter(f => !isDocOnly(f)).length === 0) {
              core.info("Doc-only PR: tier label not required.");
              return;
            }

            if (hasTier) {
              core.info(`Tier label present: ${labels.join(", ")}`);
              return;
            }

            // Only fail people who can actually fix it.
            let canLabel = false;
            try {
              const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: pr.user.login
              });
              canLabel = ["admin", "write", "maintain", "triage"].includes(perm.data.permission);
            } catch (e) {
              canLabel = false;   // 403/404 == not a collaborator
            }

            if (canLabel) {
              core.setFailed(
                "Tier label required for non-doc changes. Add one of: BCOS-L1/BCOS-L2 "
                + "(or bcos:l1/bcos:l2), or the repo tier labels: micro/standard/major/critical."
              );
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber, labels: ["needs-tier"]
              });
              core.info("Outside contributor cannot self-label; applied `needs-tier` for triage.");
            } catch (e) {
              core.warning(`Could not apply needs-tier: ${e.message}`);
            }
            core.info("Passing: assigning a tier is a maintainer action, not a contributor blocker.");
