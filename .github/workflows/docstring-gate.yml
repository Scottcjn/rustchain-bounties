# SPDX-License-Identifier: MIT
name: Docstring Bounty Gate

# Adjudicates docstring claims, which nothing else did.
#
# The #73 gate only recognises CODE-REVIEW claims, so docstring, blog, star and
# bug claims fell straight through and accumulated unpaid. On 2026-08-10 that
# was 19 open docstring claims (batches 31-49) with zero adjudication.
#
# Two triggers, for two different reasons:
#   - issues: a new claim is adjudicated on arrival
#   - schedule: claims held as `awaiting-merge` are re-checked, because a claim
#     is usually filed BEFORE its PR lands. 17 of those 19 cited an open PR.
#     Without the sweep those claims would wait forever on an event that already
#     happened.
on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: "27 */3 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Adjudicate one specific claim"
        required: false

permissions:
  issues: write
  contents: read
  pull-requests: read

concurrency:
  group: docstring-gate-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Adjudicate docstring claim(s)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RATE_PER_FUNC: "0.5"
          MAX_RTC: "25"
        run: |
          set -euo pipefail
          single="${{ github.event.inputs.issue || github.event.issue.number }}"
          if [ -n "$single" ]; then
            ISSUE_NUMBER="$single" python3 scripts/docstring_gate.py
            exit
          fi

          # Scheduled sweep: anything held awaiting-merge, plus recent claims
          # that have not been adjudicated yet.
          held=$(gh api -X GET search/issues \
                  -f q="repo:${GH_REPO} is:issue is:open label:awaiting-merge" \
                  -f per_page=60 --jq '.items[].number')
          fresh=$(gh api -X GET search/issues \
                  -f q="repo:${GH_REPO} is:issue is:open -label:bounty-eligible -label:awaiting-merge -label:needs-human docstring" \
                  -f per_page=60 --jq '.items[].number')

          n=0
          failed=0
          for i in $(printf '%s\n%s\n' "$held" "$fresh" | sort -un); do
            [ -z "$i" ] && continue
            if ! ISSUE_NUMBER="$i" python3 scripts/docstring_gate.py; then
              echo "::error::docstring gate failed for issue #$i"
              failed=$((failed+1))
            fi
            n=$((n+1))
            [ "$n" -ge 60 ] && echo "::notice::stopped at 60 claims this run; the rest process next sweep" && break
          done
          echo "adjudicated $n claim(s); $failed failed"
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
