name: RTC Auto-Pay on PR Merge

# FIX: this previously triggered on `pull_request: [closed]`, which does NOT
# receive repository secrets for PRs opened from forks (GitHub security). Almost
# every bounty claim is a fork PR, so RTC_VPS_HOST / RTC_ADMIN_KEY arrived blank
# and award_rtc exited 1 — silently failing every payout.
#
# `push: [main]` runs AFTER merge, in the trusted base-repo context, WITH secret
# access, on already-merged code. (Deliberately NOT pull_request_target, which
# would run untrusted PR head code with secrets — a known security footgun.)
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  auto-pay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve merged PR from the pushed commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fail closed on API/auth/rate-limit errors instead of swallowing into '[]'
          # on a one-shot push trigger (which permanently drops the merged PR's payout).
          pr_json=""
          for attempt in 1 2 3; do
            if pr_json=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              -H "Accept: application/vnd.github+json"); then
              break
            fi
            echo "::warning::Attempt ${attempt}/3 to resolve PRs for commit ${{ github.sha }} failed; retrying..."
            sleep $((attempt * 2))
          done
          if [ -z "$pr_json" ]; then
            echo "::error::Failed to query associated PRs for commit ${{ github.sha }}"
            exit 1
          fi
          prs_compact=$(echo "$pr_json" | jq -c '[.[] | select(.merged_at != null) | {number: .number, author: .user.login}]')
          count=$(echo "$prs_compact" | jq 'length')
          number=$(echo "$prs_compact" | jq -r '.[0].number // empty')
          author=$(echo "$prs_compact" | jq -r '.[0].author // empty')
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "author=${author}" >> "$GITHUB_OUTPUT"
          echo "prs=${prs_compact}" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No associated merged PR for this push — nothing to pay."
          else
            echo "Resolved ${count} merged PR(s) for commit ${{ github.sha }}: ${prs_compact}"
          fi

      - name: Set up Python
        if: steps.pr.outputs.number != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.pr.outputs.number != ''
        run: pip install requests

      - name: Run RTC Auto-Pay
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED_PRS_JSON: ${{ steps.pr.outputs.prs }}
          REPO: ${{ github.repository }}
          RTC_VPS_HOST: ${{ secrets.RTC_VPS_HOST }}
          RTC_ADMIN_KEY: ${{ secrets.RTC_ADMIN_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          failed=0
          while IFS=$'\t' read -r pr_num pr_auth; do
            [ -z "$pr_num" ] && continue
            PR_NUMBER="$pr_num" PR_AUTHOR="$pr_auth" python scripts/auto-pay.py || failed=$((failed + 1))
          done < <(echo "$MERGED_PRS_JSON" | jq -r '.[] | "\(.number)\t\(.author)"')
          if [ "$failed" -gt 0 ]; then
            echo "::error::RTC Auto-Pay failed for ${failed} merged PR(s)"
            exit 1
          fi
