name: Verify Bounty Claims

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      issues: write        # Post/update comments on issues
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        timeout-minutes: 3
        run: |
          # Fail fast if the package index cannot be reached
          pip install requests --default-timeout=30 --retries=0

      - name: Run bounty verification
        timeout-minutes: 10
        run: python scripts/verify_bounties.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
