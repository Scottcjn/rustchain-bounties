# SPDX-License-Identifier: MIT
name: Bounty Claim

# Lets a contributor mark a bounty as taken, so two people do not build the
# same thing without knowing.
#
# Bounty #16250 was submitted five times. Four of those pull requests created
# the identical file, so only the first could merge and three people had their
# work closed as duplicates having done nothing wrong. The issue had sat open
# with nothing showing it was already being worked on.
#
# A claim is a courtesy signal, NOT a lock. It does not reserve payment and it
# does not stop anyone submitting; first-in-time still decides who is paid. It
# exists so that people can see what is already in progress before they spend a
# week on it.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "43 * * * *"     # hourly: release expired claims
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: bounty-claim-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  claim:
    # Only for comments on ISSUES (not PRs), and skip our own bot chatter so a
    # claim confirmation cannot re-trigger the workflow.
    if: >
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record claim
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MODE: claim
          CLAIM_DAYS: "7"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: python3 scripts/bounty_claim.py

  sweep:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release expired claims
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MODE: sweep
          CLAIM_DAYS: "7"
        run: python3 scripts/bounty_claim.py
