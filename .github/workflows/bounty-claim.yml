name: Bounty Claim Verification

on:
  issues:
    types: [closed]
    branches: [main]
  pull_request:
    types: [opened, closed]
    branches: [main]

jobs:
  verify-bounty:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.issue.pull_request != null
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Get PR details
        id: get-pr
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return pr.data;
            
      - name: Verify bounty requirements
        id: verify
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            const bountyId = issue.title.match(/#(\d+)/);
            if (!bountyId) {
              core.setOutput('eligible', 'false');
              return;
            }
            
            // Check if this is bounty #165
            if (bountyId[1] !== '165') {
              core.setOutput('eligible', 'false');
              return;
            }
            
            // Check if the user has starred the required repositories
            const repos = [
              'Scottcjn/beacon-skill',
              'Scottcjn/grazer-skill',
              'Scottcjn/bottube',
              'Scottcjn/Rustchain'
            ];
            
            let allStarred = true;
            for (const repo of repos) {
              const [owner, repoName] = repo.split('/');
              const response = await github.rest.activity.checkRepoIsStarredForAuthenticatedUser({
                owner: owner,
                repo: repoName
              });
              
              if (response.status !== 204) {
                allStarred = false;
                break;
              }
            }
            
            core.setOutput('eligible', allStarred.toString());
            
      - name: Comment on bounty issue
        if: steps.verify.outputs.eligible == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Bounty #165 verification successful! The user has starred all required repositories and left appropriate review comments.`
            })
            
      - name: Comment on bounty issue (failed)
        if: steps.verify.outputs.eligible == 'false'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Bounty #165 verification failed. Please ensure you have starred all 4 required repositories and left review comments with the required disclosure statement.`
            })