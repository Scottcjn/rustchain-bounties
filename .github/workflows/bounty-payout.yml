# SPDX-License-Identifier: MIT
name: Bounty Payout (eligible #73 reviews)

# Pays verified-eligible code-review claims as wallets confirm. Eligibility is
# set by the PR-Review Gate (label) or a maintainer ("Verified eligible").
#
# DORMANT: Bounty #73 closed 2026-06-05 (pool retired 06-14) and the docstring
# bounty was retired (#16907). The script now refuses to pay from a pool whose
# bounty issue is not OPEN, so the cron is off rather than running to fail.
# To revive: open the replacement bounty, set REVIEW_BOUNTY_ISSUE (and/or
# DOCSTRING_BOUNTY_ISSUE) to its number, and uncomment the schedule.
on:
  # schedule:
  #   - cron: "23 */6 * * *"   # every 6h
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: bounty-payout
  cancel-in-progress: false

jobs:
  payout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pay eligible claims
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RTC_ADMIN_KEY: ${{ secrets.RTC_ADMIN_KEY }}
          RTC_VPS_HOST: ${{ secrets.RTC_VPS_HOST }}
          GH_REPO: ${{ github.repository }}
          RATE_RTC: "3"
          MAX_PER_RUN: "40"
          # The pools this run may pay from. Each must be an OPEN issue in this
          # repo or every claim drawn on it is refused and the run goes red.
          REVIEW_BOUNTY_ISSUE: "73"
          DOCSTRING_BOUNTY_ISSUE: ""
        run: python3 scripts/bounty_payout.py
