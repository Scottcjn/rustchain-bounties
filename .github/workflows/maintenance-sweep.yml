# SPDX-License-Identifier: MIT
name: Maintenance Sweep

# Publishes a daily triage of everything across the org awaiting a maintainer.
#
# The failure this addresses is not "we lack a report", it is "nobody looks".
# So the digest is written INTO a tracking issue rather than left in a job log:
# a log nobody opens is the same as no log. On 2026-08-07, 287 of 412 open PRs
# org-wide had zero comments, mirroring the issue-side backlog (1,269 claims,
# median silence 82 days) that collapsed contributor retention.
#
# Both maintainer identities (Scottcjn and sophiaeagent-beep) count as "us",
# so a reply from either clears a thread and neither is mistaken for an
# external contributor.
on:
  schedule:
    - cron: "31 7 * * *"   # daily
  workflow_dispatch:
    inputs:
      limit:
        description: "How many open PRs to scan"
        required: false
        default: "250"
      tracking_issue:
        description: "Issue number to write the digest into"
        required: false
        default: ""

permissions:
  issues: write
  contents: read
  pull-requests: read

concurrency:
  group: maintenance-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run sweep
        id: sweep
        env:
          # A default GITHUB_TOKEN is scoped to this repo only; the sweep reads
          # the whole org, so a PAT is required for full coverage. Without one
          # the run still works but sees only this repository.
          GH_TOKEN: ${{ secrets.BOUNTY_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/maintenance_sweep.py \
            --limit "${{ github.event.inputs.limit || '250' }}" \
            > sweep.md 2> sweep.err || true
          cat sweep.err >&2 || true
          tee -a "$GITHUB_STEP_SUMMARY" < sweep.md
      - name: Publish digest to tracking issue
        if: ${{ github.event.inputs.tracking_issue != '' || vars.MAINTENANCE_TRACKING_ISSUE != '' }}
        env:
          GH_TOKEN: ${{ secrets.BOUNTY_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.inputs.tracking_issue || vars.MAINTENANCE_TRACKING_ISSUE }}
        run: |
          # Replace the issue body rather than appending a comment each day --
          # a tracking issue with 300 stale comments is another thing nobody
          # reads. The body always shows current state.
          gh issue edit "$ISSUE" -R "${{ github.repository }}" --body-file sweep.md
          echo "digest written to issue #$ISSUE"
