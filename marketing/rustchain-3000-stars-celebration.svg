<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">RustChain 3,000 Stars Celebration</title>
  <desc id="desc">A vintage retro celebration graphic for RustChain reaching 3,000 stars across all repositories. Features a large 3,000 with a glowing star, RustChain branding, CRT terminal styling, and subtle animations.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E55A2B"/>
    </linearGradient>
    <linearGradient id="crtGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33ff33"/>
      <stop offset="100%" stop-color="#00cc00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlinePattern" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="#000" opacity="0.08"/>
    </pattern>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Twinkling background stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="90" r="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="200" cy="150" r="1" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="350" cy="70" r="2" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="500" cy="120" r="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.5s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="700" cy="80" r="1" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.2s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="850" cy="140" r="2" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.8s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="1000" cy="60" r="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="1120" cy="110" r="1" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="150" cy="550" r="1.5" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.8s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="1050" cy="580" r="1" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.1s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle cx="600" cy="40" r="1.5" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.3s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
  </g>

  <!-- Vintage border frame -->
  <rect x="15" y="15" width="1170" height="600" rx="20" fill="none" stroke="#FF6B35" stroke-width="3" opacity="0.4"/>
  <rect x="25" y="25" width="1150" height="580" rx="16" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.25"/>

  <!-- Corner ornaments -->
  <g opacity="0.6" stroke="#FFD700" stroke-width="2" fill="none">
    <path d="M40,40 L40,100 M40,40 L100,40"/>
    <circle cx="40" cy="40" r="5" fill="#FFD700"/>
    <path d="M1160,40 L1160,100 M1160,40 L1100,40"/>
    <circle cx="1160" cy="40" r="5" fill="#FFD700"/>
    <path d="M40,590 L40,530 M40,590 L100,590"/>
    <circle cx="40" cy="590" r="5" fill="#FFD700"/>
    <path d="M1160,590 L1160,530 M1160,590 L1100,590"/>
    <circle cx="1160" cy="590" r="5" fill="#FFD700"/>
  </g>

  <!-- Top banner -->
  <text x="600" y="70" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#FFD700" letter-spacing="10" opacity="0.8">★ MILESTONE ACHIEVED ★</text>

  <!-- Main 3,000 number -->
  <text x="560" y="320" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="200" font-weight="bold" fill="url(#goldGrad)" filter="url(#glow)">3,000</text>

  <!-- Glowing star next to number -->
  <g transform="translate(920, 250) scale(1.1)">
    <polygon points="0,-50 14.7,-15.5 47.6,-15.5 20.2,6.2 29.4,40.5 0,20 -29.4,40.5 -20.2,6.2 -47.6,-15.5 -14.7,-15.5" fill="url(#goldGrad)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite" additive="sum"/>
    </polygon>
  </g>

  <!-- STARS label -->
  <text x="600" y="400" text-anchor="middle" font-family="'Courier New', monospace" font-size="56" fill="#FFD700" letter-spacing="20" filter="url(#glow)">STARS</text>

  <!-- Chain band decoration -->
  <g transform="translate(600, 435)" opacity="0.4">
    <g fill="none" stroke="#FFD700" stroke-width="2">
      <rect x="-250" y="-8" width="30" height="16" rx="4"/>
      <rect x="-200" y="-8" width="30" height="16" rx="4"/>
      <rect x="-150" y="-8" width="30" height="16" rx="4"/>
      <rect x="-100" y="-8" width="30" height="16" rx="4"/>
      <rect x="-50" y="-8" width="30" height="16" rx="4"/>
      <rect x="0" y="-8" width="30" height="16" rx="4"/>
      <rect x="50" y="-8" width="30" height="16" rx="4"/>
      <rect x="100" y="-8" width="30" height="16" rx="4"/>
      <rect x="150" y="-8" width="30" height="16" rx="4"/>
      <rect x="200" y="-8" width="30" height="16" rx="4"/>
      <rect x="250" y="-8" width="30" height="16" rx="4"/>
    </g>
  </g>

  <!-- RustChain branding -->
  <text x="600" y="470" text-anchor="middle" font-family="'Courier New', 'Fira Code', monospace" font-size="44" font-weight="bold" fill="url(#orangeGrad)" letter-spacing="12" filter="url(#heavyGlow)">RUSTCHAIN</text>
  <text x="600" y="505" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#c0c0c0" letter-spacing="8">PROOF OF ANTIQUITY</text>

  <!-- CRT terminal strip -->
  <rect x="140" y="515" width="920" height="70" rx="10" fill="#0a1a0a" stroke="#33ff33" stroke-width="1.5" opacity="0.9"/>
  <rect x="140" y="515" width="920" height="70" rx="10" fill="url(#scanlinePattern)" opacity="0.5"/>
  <text x="160" y="540" font-family="'Courier New', monospace" font-size="18" fill="#33ff33" opacity="0.9">$ rustchain status --milestone</text>
  <text x="160" y="565" font-family="'Courier New', monospace" font-size="18" fill="#33ff33" opacity="0.9">MILESTONE: 3,000 ⭐ ACROSS ALL REPOS</text>
  <rect x="160" y="550" width="10" height="18" fill="#33ff33" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Crab mascot -->
  <g transform="translate(80, 560) scale(0.2)" opacity="0.8">
    <ellipse cx="0" cy="0" rx="100" ry="70" fill="#FF6B35"/>
    <circle cx="-30" cy="-35" r="14" fill="#fff"/>
    <circle cx="30" cy="-35" r="14" fill="#fff"/>
    <circle cx="-30" cy="-35" r="7" fill="#1a1a2e"/>
    <circle cx="30" cy="-35" r="7" fill="#1a1a2e"/>
    <path d="M-110,-30 C-140,-65 -170,-70 -180,-50 C-185,-40 -175,0 -150,10 L-100,0 Z" fill="#FF6B35"/>
    <path d="M110,-30 C140,-65 170,-70 180,-50 C185,-40 175,0 150,10 L100,0 Z" fill="#FF6B35"/>
    <line x1="-85" y1="15" x2="-130" y2="50" stroke="#E55A2B" stroke-width="5" stroke-linecap="round"/>
    <line x1="-75" y1="40" x2="-120" y2="80" stroke="#E55A2B" stroke-width="5" stroke-linecap="round"/>
    <line x1="85" y1="15" x2="130" y2="50" stroke="#E55A2B" stroke-width="5" stroke-linecap="round"/>
    <line x1="75" y1="40" x2="120" y2="80" stroke="#E55A2B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Hashtags -->
  <text x="600" y="605" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#606080" letter-spacing="2">#RustChain #3000Stars #ProofOfAntiquity #ElyanLabs</text>
</svg>
