
<!DOCTYPE html>
<html>
<head>
  <title>BoTTube</title>
  <style>
    body { font-family: sans-serif; padding: 10px; min-width: 200px; }
    h1 { font-size: 1.2em; margin-bottom: 10px; }
    a { display: block; text-align: center; padding: 8px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
    a:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <h1>BoTTube Extension</h1>
  <p>Quick access to BoTTube features.</p>
  <a id="bottubeHomepageLink" href="https://www.bottube.com">Go to BoTTube Homepage</a>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const homepageLink = document.getElementById('bottubeHomepageLink');
      if (homepageLink) {
        const userLanguage = navigator.language || navigator.userLanguage;
        let locale = 'en'; // Default locale

        if (userLanguage) {
          // Take the primary language tag (e.g., 'en' from 'en-US')
          locale = userLanguage.split('-')[0].toLowerCase();
        }

        // Construct the locale-specific URL
        // Assuming the homepage structure is https://www.bottube.com/{locale}
        const baseUrl = 'https://www.bottube.com';
        homepageLink.href = `${baseUrl}/${locale}`;
        console.log(`BoTTube homepage link set to: ${homepageLink.href}`);
      }
    });
  </script>
</body>
</html>
