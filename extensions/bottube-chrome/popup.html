
<!DOCTYPE html>
<html>
<head>
  <title>BoTTube</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      padding: 10px; 
      width: 300px; 
      background-color: #f0f2f5;
      color: #333;
    }
    h1 { 
      color: #1a73e8; 
      font-size: 20px; 
      margin-bottom: 15px;
      text-align: center;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
      text-align: center;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      background-color: #1a73e8;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #1558b0;
    }
  </style>
</head>
<body>
  <!-- CHANGE: Replaced hardcoded title with a __MSG_ placeholder for localization -->
  <h1>__MSG_extensionName__</h1> 
  <p>__MSG_homepageDescription__</p>
  <button id="openSettings">__MSG_openSettingsButton__</button>
  <script src="popup.js"></script> <!-- Assuming a popup.js exists for functionality -->
</body>
</html>
